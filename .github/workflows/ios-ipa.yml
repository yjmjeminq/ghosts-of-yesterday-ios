name: Package unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      xcode_asset_id:
        description: Private draft release asset containing the Unity Xcode export
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPORT_DIR: ${{ runner.temp }}/ghosts-xcode
      ARCHIVE: ${{ runner.temp }}/GhostsOfYesterday.xcarchive
      IPA: ${{ runner.temp }}/GhostsOfYesterday-unsigned.ipa
    steps:
      - name: Download the Unity export
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE_ASSET_ID: ${{ inputs.xcode_asset_id }}
        run: |
          [[ "$XCODE_ASSET_ID" =~ ^[0-9]+$ ]]
          mkdir -p "$EXPORT_DIR"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$XCODE_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/ghosts-xcode.tar.gz"
          tar -xzf "$RUNNER_TEMP/ghosts-xcode.tar.gz" -C "$EXPORT_DIR"
          test -f "$EXPORT_DIR/Unity-iPhone.xcodeproj/project.pbxproj"
      - name: Archive for iPhone
        run: |
          xcodebuild -project "$EXPORT_DIR/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone -configuration Release -destination generic/platform=iOS \
            -archivePath "$ARCHIVE" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package and verify the IPA
        run: |
          set -- "$ARCHIVE"/Products/Applications/*.app
          [[ "$#" -eq 1 && -d "$1" ]]
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$1/Info.plist")"
          lipo -verify_arch arm64 "$1/$executable"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$1" "$RUNNER_TEMP/Payload/${1##*/}"
          cd "$RUNNER_TEMP"
          zip -qr -y "$IPA" Payload
          shasum -a 256 "$IPA" > "${IPA%.ipa}.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GhostsOfYesterday-iOS-${{ github.run_number }}
          path: |
            ${{ env.IPA }}
            ${{ runner.temp }}/GhostsOfYesterday-unsigned.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
